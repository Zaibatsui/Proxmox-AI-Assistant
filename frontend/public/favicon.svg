<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="zGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Stylized "Z" with tech feel -->
  <g transform="translate(32, 32)">
    <!-- Top horizontal bar of Z -->
    <rect x="-16" y="-18" width="32" height="6" fill="url(#zGradient)" rx="1"/>
    <!-- Diagonal of Z -->
    <rect x="-16" y="-6" width="36" height="6" fill="url(#zGradient)" rx="1" transform="rotate(-28)"/>
    <!-- Bottom horizontal bar of Z -->
    <rect x="-16" y="12" width="32" height="6" fill="url(#zGradient)" rx="1"/>
    
    <!-- Small circuit-like dots for tech aesthetic -->
    <circle cx="-14" cy="-15" r="1.5" fill="#34d399" opacity="0.8"/>
    <circle cx="14" cy="-15" r="1.5" fill="#34d399" opacity="0.8"/>
    <circle cx="-14" cy="15" r="1.5" fill="#34d399" opacity="0.8"/>
    <circle cx="14" cy="15" r="1.5" fill="#34d399" opacity="0.8"/>
  </g>
</svg>
