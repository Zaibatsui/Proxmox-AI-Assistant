version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:4.4
    container_name: proxmox-ai-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:?set MONGO_DB_NAME in .env}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?set MONGO_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
    # MONGO_INITDB_ROOT_* above is ONLY honoured when /data/db is empty. The
    # mongodb_data volume already has data, so those vars alone will not enable
    # auth on this stack -- '--auth' is set explicitly so enforcement does not
    # depend on first-run initialisation. See SECURITY_FIX_NOTES.md for the
    # one-time step that creates the root user on the existing volume.
    command: ["mongod", "--auth"]
    # Bound to loopback: the backend reaches Mongo over the compose network as
    # 'mongodb:27017', so this publish is only for local admin tools. Delete
    # these two lines entirely if you never use mongosh/Compass from the host.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - proxmox-ai-network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proxmox-ai-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=${MONGO_URL:?set MONGO_URL in .env}
      - DB_NAME=${MONGO_DB_NAME:?set MONGO_DB_NAME in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    networks:
      - proxmox-ai-network
    command: uvicorn server:app --host 0.0.0.0 --port 8001 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proxmox-ai-frontend
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - proxmox-ai-network
    command: npm start

networks:
  proxmox-ai-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
