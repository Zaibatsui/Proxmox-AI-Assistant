<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Server/Stack Icon - No background, just the icon -->
  <defs>
    <linearGradient id="serverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Top Server -->
  <rect x="12" y="16" width="40" height="12" rx="2" fill="none" stroke="url(#serverGradient)" stroke-width="3"/>
  <circle cx="20" cy="22" r="2" fill="url(#serverGradient)"/>
  
  <!-- Bottom Server -->
  <rect x="12" y="36" width="40" height="12" rx="2" fill="none" stroke="url(#serverGradient)" stroke-width="3"/>
  <circle cx="20" cy="42" r="2" fill="url(#serverGradient)"/>
</svg>
