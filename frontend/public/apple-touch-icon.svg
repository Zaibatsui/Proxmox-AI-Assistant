<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Apple Touch Icon - Server Stack -->
  <defs>
    <linearGradient id="serverApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Top Server -->
  <g filter="url(#glow)">
    <rect x="30" y="45" width="120" height="35" rx="4" fill="none" stroke="url(#serverApple)" stroke-width="8"/>
    <circle cx="55" cy="62.5" r="6" fill="url(#serverApple)"/>
  </g>
  
  <!-- Bottom Server -->
  <g filter="url(#glow)">
    <rect x="30" y="100" width="120" height="35" rx="4" fill="none" stroke="url(#serverApple)" stroke-width="8"/>
    <circle cx="55" cy="117.5" r="6" fill="url(#serverApple)"/>
  </g>
</svg>
