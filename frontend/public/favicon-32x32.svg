<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simple 32x32 favicon -->
  <defs>
    <linearGradient id="bg32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg32)"/>
  
  <!-- Simple bold "Z" -->
  <g transform="translate(16, 16)">
    <rect x="-10" y="-10" width="20" height="4" fill="#ffffff" rx="1"/>
    <rect x="-10" y="-3" width="22" height="4" fill="#ffffff" rx="1" transform="rotate(-28)"/>
    <rect x="-10" y="6" width="20" height="4" fill="#ffffff" rx="1"/>
  </g>
</svg>
