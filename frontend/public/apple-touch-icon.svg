<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Apple Touch Icon - Larger, more detail -->
  <defs>
    <linearGradient id="bgGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0891b2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="zGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient2)"/>
  
  <!-- Stylized "Z" -->
  <g transform="translate(90, 90)" filter="url(#shadow)">
    <!-- Top bar -->
    <rect x="-50" y="-55" width="100" height="18" fill="url(#zGradient2)" rx="3"/>
    <!-- Diagonal -->
    <rect x="-50" y="-18" width="112" height="18" fill="url(#zGradient2)" rx="3" transform="rotate(-28)"/>
    <!-- Bottom bar -->
    <rect x="-50" y="37" width="100" height="18" fill="url(#zGradient2)" rx="3"/>
    
    <!-- Tech accents -->
    <circle cx="-45" cy="-46" r="4" fill="#34d399" opacity="0.9"/>
    <circle cx="45" cy="-46" r="4" fill="#34d399" opacity="0.9"/>
    <circle cx="-45" cy="46" r="4" fill="#34d399" opacity="0.9"/>
    <circle cx="45" cy="46" r="4" fill="#34d399" opacity="0.9"/>
    
    <!-- Small AI-like dots pattern -->
    <circle cx="-30" cy="-30" r="2" fill="#60a5fa" opacity="0.6"/>
    <circle cx="30" cy="30" r="2" fill="#60a5fa" opacity="0.6"/>
  </g>
</svg>
