<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simple 32x32 favicon - Server icon -->
  <defs>
    <linearGradient id="server32" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Top Server -->
  <rect x="6" y="8" width="20" height="6" rx="1" fill="none" stroke="url(#server32)" stroke-width="2"/>
  <circle cx="10" cy="11" r="1" fill="url(#server32)"/>
  
  <!-- Bottom Server -->
  <rect x="6" y="18" width="20" height="6" rx="1" fill="none" stroke="url(#server32)" stroke-width="2"/>
  <circle cx="10" cy="21" r="1" fill="url(#server32)"/>
</svg>
